name: CI

# Spec §14. Three Python versions, both languages, on every push and PR.
#
# The suite is deliberately stdlib-only, so CI installs nothing to run it: what
# runs here is the exact command the README tells a user to run. A `pip install
# pytest` step would have CI testing a slightly different thing than everyone
# else, for no coverage gained -- `run_tests.py` discovers the same unittest
# TestCases pytest would.
#
# Node is installed rather than optional. The JS tests skip themselves when node
# is missing (so a bare ComfyUI box can still run the Python suite), and a skip
# is invisible in a green run -- so the .mjs files are also invoked directly
# below, where their absence is a failure instead of a shrug.
#
# The no-network source scan runs here too. It inspects the shipped package and
# excludes `tests/` and `.github/`, so this file having network access is not a
# contradiction: the invariant is about what the pack does at import and at
# execution, not about the runner.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show versions
        run: |
          python --version
          node --version

      - name: Full suite (Python + the JS tests it drives)
        run: python run_tests.py

      - name: JS tests, run directly so a missing runtime fails
        run: |
          node tests/js/test_widget_guard.mjs
          node tests/js/test_widget_order.mjs
          node tests/js/test_sockets.mjs

      - name: Cross-language parity, named explicitly
        # Already inside the suite above. Called out as its own step because it
        # is the guard that a widget added on one side of the language boundary
        # fails the build -- worth seeing by name in the check list.
        run: python -m unittest tests.test_js_guard -v

      - name: Environment invariants (§18.1)
        run: python -m unittest tests.test_no_network tests.test_shipped_assets -v

  tensor-layer:
    # The job that exists because a skip is invisible in a green run.
    #
    # Sixteen tests guard themselves with `import torch` in setUp and skip when it
    # is missing, which is every runner in the matrix above. That is deliberate --
    # the suite must pass on a bare box -- but it meant those sixteen had never
    # once executed anywhere: three Python versions green while `media.audio_span`
    # and `media.treat_audio_seams`, the two functions the lip-sync trim rests on,
    # were never called. The bug that hid there was a relative import inside a
    # function body, which raises when the function is called rather than when the
    # module loads. It surfaced only when the suite was finally run inside a
    # working ComfyUI, where torch is present.
    #
    # So: one job, one Python, CPU-only wheels. Kept out of the matrix on purpose.
    # Installing torch there would cost three downloads and would destroy the
    # property the matrix exists to prove -- that this suite needs nothing
    # installed. This job proves the other half.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Node too, so the JS-driving tests cannot skip either and the
      # zero-skip assertion below is a statement about the whole suite.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CPU-only torch
        # The CPU index, not PyPI: the default wheel carries the CUDA runtime and
        # is gigabytes for a runner that has no GPU. Unpinned, for the reason
        # requirements.txt gives -- this pack must not fight a host's torch over a
        # version, and CI testing a pin nobody runs would be testing the pin.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            torch numpy
          python -c "import torch, numpy; print(torch.__version__, numpy.__version__)"

      - name: Full suite, and nothing may skip
        # The assertion is the point. Without it this job would install torch,
        # skip the same sixteen tests for some new reason, and report success.
        run: |
          set -o pipefail
          python run_tests.py 2>&1 | tee suite.log
          if grep -q "skipped" suite.log; then
            echo "::error::a test skipped in the job whose whole purpose is that none do"
            grep -o "skipped=[0-9]*" suite.log || true
            exit 1
          fi

      - name: The tensor tests, named so their absence is a failure
        # Already inside the suite above, and named here for the same reason the
        # cross-language parity step is: these are the ones that were silently
        # absent, and a check list that says so by name is worth the duplication.
        run: |
          python -m unittest -v \
            tests.test_audio_role.TestTheTensorSlicing \
            tests.test_concat.TestTheTensorRind \
            tests.test_lipsync_timing.TheTensorSlicing

  import-purity:
    # A separate job with nothing installed. The pure core must import on a
    # machine with no torch and no ComfyUI; running it alongside the matrix
    # would let a stray dependency hide behind another step's install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The core imports with nothing installed
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import comfyui_pulse_studio as pkg
          for module in pkgutil.iter_modules(pkg.__path__):
              importlib.import_module("%s.%s" % (pkg.__name__, module.name))
          for banned in ("torch", "comfy", "comfy_extras", "folder_paths", "nodes"):
              assert banned not in sys.modules, "%s reached the pure core" % banned
          print("imported %d modules, no torch, no comfy" % len(list(pkgutil.iter_modules(pkg.__path__))))
          PY

  distribution:
    # The licence boundary of this project is a claim about what ships, and
    # nothing else in CI builds anything. NOTICE holds the only copy of
    # upstream's MIT copyright notice; MIT grants its permissions on the
    # condition that the notice travels with every copy, so a build that drops
    # it is a violation that correct prose in the repository does not cure.
    # Asserted against the built artefacts rather than against pyproject.toml,
    # because the manifest is the intent and the artefact is the fact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade "setuptools>=77" build
          python -m build

      - name: NOTICE and LICENSE are in both artefacts
        run: |
          python - <<'PY'
          import pathlib, tarfile, zipfile

          dist = sorted(pathlib.Path("dist").iterdir())
          print("built:", [p.name for p in dist])
          sdist = next(p for p in dist if p.suffix == ".gz")
          wheel = next(p for p in dist if p.suffix == ".whl")

          with tarfile.open(sdist) as tar:
              sdist_names = tar.getnames()
          with zipfile.ZipFile(wheel) as zf:
              wheel_names = zf.namelist()

          for label, names in (("sdist", sdist_names), ("wheel", wheel_names)):
              for wanted in ("LICENSE", "NOTICE"):
                  hits = [n for n in names if n.rsplit("/", 1)[-1] == wanted]
                  assert hits, "%s is missing from the %s" % (wanted, label)
                  print("%s: %s -> %s" % (label, wanted, hits[0]))
              # The GPL-3.0 reference tree must never reach a distribution.
              # .gitignore does not apply to a build; MANIFEST.in's prune does.
              leaked = [n for n in names if "reference_purpose" in n]
              assert not leaked, "GPL reference tree leaked into the %s: %r" % (label, leaked)
              assert not [n for n in names if n.startswith(("tests/", "tests\\"))
                          and label == "wheel"], "tests/ leaked into the wheel"
          print("both artefacts carry LICENSE and NOTICE; no GPL reference tree")
          PY
