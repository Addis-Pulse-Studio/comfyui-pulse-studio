[build-system]
# Declared explicitly. Without a build-system table pip falls back to setuptools'
# legacy backend, and this is a flat layout: `nodes.py`, `media.py`, `render.py`
# and `comfyui_pulse_studio/` all sit at the root next to `tests/`, `js/` and
# `example_workflows/`. Flat-layout autodiscovery either errors on the multiple
# top-level names or guesses, and a wrong guess can sweep in the GPL-3.0
# reference tree, which `.gitignore` protects from git but not from a build.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-pulse-studio"
# Keep in step with SCHEMA_VERSION in comfyui_pulse_studio/constants.py.
# tests/test_packaging.py fails if the two drift.
version = "3.0.0"
description = "Shot-timeline direction and per-character voice binding for MiniMax H3."
license = "Apache-2.0"
# NOTICE, not just LICENSE. It is the only place upstream's MIT copyright notice
# exists, and MIT requires that notice to travel with every copy while
# Apache-2.0 section 4(d) requires the same of NOTICE itself. Shipping LICENSE
# alone breaks both conditions at once -- and the whole licence boundary of this
# project rests on that attribution surviving distribution. See NOTICE.
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/Addis-Pulse-Studio/comfyui-pulse-studio"

[tool.setuptools]
# Spelled out rather than discovered, for the reason in [build-system] above.
packages = ["comfyui_pulse_studio"]
py-modules = ["nodes", "media", "render"]

[tool.comfy]
# Confirmed 2026-08-09 against the publisher at
# https://registry.comfy.org/publishers/addis-pulse
PublisherId = "addis-pulse"
DisplayName = "Pulse Studio"
Icon = ""

[tool.pytest.ini_options]
# Kept so that `pytest` at least looks in the right place, NOT because pytest can
# run this suite -- it cannot, and the reason is structural rather than a setting.
#
# A ComfyUI custom node must expose a package `__init__.py` at its root, and that
# file imports `nodes.py` -> `torch` + `comfy`. pytest models any directory
# holding an `__init__.py` as a Package and imports it, so collecting `tests/`
# imports the pack's entry point on the way past. Outside ComfyUI that dies on the
# relative import; inside it dies on the ComfyUI imports. Either way every test
# errors at setup, one root cause reported once per test, and nothing runs.
#
# Verified against pytest 9.1.1: --import-mode=importlib, --ignore=__init__.py,
# removing tests/__init__.py, and combinations of all three do not avoid it.
#
# `python run_tests.py` is unittest discovery, which does not model directories as
# packages. It is what CI runs and what CONTRIBUTING documents.
testpaths = ["tests"]
